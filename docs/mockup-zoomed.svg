<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <clipPath id="circle-clip-zoom">
      <circle cx="150" cy="150" r="140"/>
    </clipPath>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="road-glow3">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer bezel -->
  <circle cx="150" cy="150" r="148" fill="#111" stroke="#333" stroke-width="3"/>

  <!-- Display area -->
  <g clip-path="url(#circle-clip-zoom)">
    <!-- Land background -->
    <circle cx="150" cy="150" r="140" fill="#1a0a2e"/>

    <!-- Water (coastal area on the right) -->
    <path d="M220,10 Q240,50 235,100 Q230,150 245,200 Q260,250 240,290 L290,290 L290,10 Z" fill="#0d4f4f"/>

    <!-- Beach/shore transition -->
    <path d="M220,10 Q240,50 235,100 Q230,150 245,200 Q260,250 240,290" stroke="#1a6060" fill="none" stroke-width="3" opacity="0.6"/>

    <!-- Building blocks (zoomed in, larger) -->
    <g fill="#1f0e35">
      <rect x="20" y="20" width="65" height="85" rx="2"/>
      <rect x="100" y="20" width="55" height="60" rx="2"/>
      <rect x="20" y="120" width="65" height="60" rx="2"/>
      <rect x="100" y="95" width="55" height="70" rx="2"/>
      <rect x="170" y="30" width="45" height="55" rx="2"/>
      <rect x="170" y="100" width="40" height="60" rx="2"/>
      <rect x="30" y="200" width="55" height="70" rx="2"/>
      <rect x="100" y="185" width="60" height="65" rx="2"/>
      <rect x="175" y="180" width="40" height="50" rx="2"/>
    </g>

    <!-- Special building (highlighted, like a mission marker) -->
    <rect x="105" y="100" width="45" height="55" rx="2" fill="#2d1050" stroke="#ff3da5" stroke-width="1" opacity="0.8"/>

    <!-- Major roads -->
    <g stroke="#ff6ec7" fill="none" filter="url(#road-glow3)">
      <!-- Main horizontal -->
      <line x1="10" y1="110" x2="225" y2="110" stroke-width="6"/>
      <!-- Main vertical -->
      <line x1="90" y1="10" x2="90" y2="290" stroke-width="6"/>
      <!-- Coastal road -->
      <path d="M10,180 L215,180" stroke-width="6"/>
    </g>

    <!-- Secondary roads -->
    <g stroke="#ff6ec7" fill="none" opacity="0.5" stroke-width="3">
      <line x1="160" y1="10" x2="160" y2="290"/>
      <line x1="10" y1="40" x2="220" y2="40"/>
      <line x1="10" y1="270" x2="200" y2="270"/>
    </g>

    <!-- Intersection detail -->
    <g fill="#c7548f" opacity="0.3">
      <rect x="82" y="102" width="16" height="16" rx="1"/>
      <rect x="82" y="172" width="16" height="16" rx="1"/>
      <rect x="152" y="102" width="16" height="16" rx="1"/>
    </g>

    <!-- Player arrow (rotated ~45 degrees, heading NE) -->
    <g transform="translate(150,150) rotate(45)" filter="url(#glow3)">
      <!-- Outer arrow (pink) -->
      <polygon points="0,-14 -8,6 0,1 8,6" fill="#ff6ec7"/>
      <!-- Inner arrow (white) -->
      <polygon points="0,-10 -5,4 0,0 5,4" fill="#ffffff"/>
    </g>

    <!-- Subtle edge vignette -->
    <circle cx="150" cy="150" r="138" fill="none" stroke="#0a061a" stroke-width="4" opacity="0.4"/>
  </g>

  <!-- Label -->
  <text x="150" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Zoomed In — Coastal Area</text>
</svg>
