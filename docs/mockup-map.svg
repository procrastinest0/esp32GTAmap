<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <clipPath id="circle-clip-map">
      <circle cx="150" cy="150" r="140"/>
    </clipPath>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="road-glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer bezel -->
  <circle cx="150" cy="150" r="148" fill="#111" stroke="#333" stroke-width="3"/>

  <!-- Display area -->
  <g clip-path="url(#circle-clip-map)">
    <!-- Land background -->
    <circle cx="150" cy="150" r="140" fill="#1a0a2e"/>

    <!-- Water areas -->
    <path d="M10,180 Q60,160 80,200 Q100,250 50,280 L10,290 Z" fill="#0d4f4f"/>
    <path d="M220,10 Q260,30 290,20 L290,100 Q250,120 230,80 Q210,40 220,10 Z" fill="#0d4f4f"/>
    <path d="M250,200 Q270,220 290,210 L290,290 L200,290 Q220,260 240,250 Q260,230 250,200 Z" fill="#0d4f4f"/>

    <!-- Building blocks -->
    <g fill="#1f0e35" opacity="0.8">
      <!-- Block 1 -->
      <rect x="55" y="45" width="40" height="55" rx="1"/>
      <!-- Block 2 -->
      <rect x="110" y="45" width="35" height="35" rx="1"/>
      <!-- Block 3 -->
      <rect x="165" y="55" width="45" height="40" rx="1"/>
      <!-- Block 4 -->
      <rect x="55" y="115" width="40" height="40" rx="1"/>
      <!-- Block 5 -->
      <rect x="110" y="95" width="35" height="45" rx="1"/>
      <!-- Block 6 -->
      <rect x="165" y="110" width="50" height="35" rx="1"/>
      <!-- Block 7 -->
      <rect x="70" y="170" width="35" height="45" rx="1"/>
      <!-- Block 8 -->
      <rect x="120" y="165" width="40" height="40" rx="1"/>
      <!-- Block 9 -->
      <rect x="175" y="160" width="35" height="35" rx="1"/>
      <!-- Block 10 -->
      <rect x="105" y="220" width="50" height="35" rx="1"/>
      <!-- Block 11 -->
      <rect x="170" y="210" width="30" height="30" rx="1"/>
    </g>

    <!-- Major roads (neon pink) -->
    <g stroke="#ff6ec7" fill="none" filter="url(#road-glow)">
      <!-- Horizontal main road -->
      <line x1="10" y1="105" x2="290" y2="105" stroke-width="4"/>
      <!-- Vertical main road -->
      <line x1="155" y1="10" x2="155" y2="290" stroke-width="4"/>
      <!-- Highway (brighter pink) -->
      <line x1="10" y1="155" x2="290" y2="155" stroke-width="5" stroke="#ff3da5"/>
    </g>

    <!-- Minor roads -->
    <g stroke="#ff6ec7" fill="none" opacity="0.6" stroke-width="2">
      <line x1="100" y1="10" x2="100" y2="290"/>
      <line x1="215" y1="10" x2="215" y2="290"/>
      <line x1="10" y1="50" x2="290" y2="50"/>
      <line x1="10" y1="210" x2="290" y2="210"/>
      <line x1="10" y1="260" x2="200" y2="260"/>
    </g>

    <!-- Curved road -->
    <path d="M60,160 Q90,190 120,160" stroke="#ff6ec7" fill="none" stroke-width="2" opacity="0.6"/>

    <!-- Player arrow (pointing up/north) -->
    <g transform="translate(150,150)" filter="url(#glow2)">
      <!-- Outer arrow (pink) -->
      <polygon points="0,-12 -7,5 0,1 7,5" fill="#ff6ec7"/>
      <!-- Inner arrow (white) -->
      <polygon points="0,-9 -4,3 0,0 4,3" fill="#ffffff"/>
    </g>

    <!-- Subtle circular border -->
    <circle cx="150" cy="150" r="138" fill="none" stroke="#2d1050" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Label -->
  <text x="150" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Map View — Vice City Style</text>
</svg>
